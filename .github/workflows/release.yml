name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Run verification suite
        run: |
          node --test test/*.test.js
          node tools/verify-parity.mjs
          node tools/verify-prompt-fidelity.mjs

      - name: Pack version-free release tarball (skill-evolution.tgz)
        run: |
          npm pack
          mv skill-evolution-*.tgz skill-evolution.tgz

      - name: Upload skill-evolution.tgz to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" skill-evolution.tgz --clobber

      - name: Publish to npm (when NPM_TOKEN is configured)
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
