name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check all modules
        run: |
          for f in index.js client.js lib/*.js; do
            node --check "$f"
          done

      - name: Run unit test suite (70 tests)
        run: node --test test/*.test.js

      - name: Run capability parity audit (41/41)
        run: node tools/verify-parity.mjs

      - name: Run prompt fidelity audit
        run: node tools/verify-prompt-fidelity.mjs

      - name: Run sanitization gate
        run: node scripts/sanitize-check.mjs
